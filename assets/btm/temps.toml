# bottom (btm) layout for the bar's temperature button (bin/temps-monitor):
# temperatures first, then CPU load and the processes behind it.

[flags]
temperature_type = "c"
rate = "1s"
default_widget_type = "temp"

# Unlabelled board/ACPI sensors (one reads -55°) push the CPU off the list.
[temperature.sensor_filter]
is_list_ignored = true
list = ["acpitz", "gigabyte_wmi"]

[temperature_graph]
legend_position = "top-left"

[temperature_graph.sensor_filter]
is_list_ignored = true
list = ["acpitz", "gigabyte_wmi"]

[[row]]
  ratio = 45
  [[row.child]]
    ratio = 3
    type = "temp_graph"
  [[row.child]]
    ratio = 2
    type = "temp"
    default = true
[[row]]
  ratio = 25
  [[row.child]]
    type = "cpu"
[[row]]
  ratio = 30
  [[row.child]]
    type = "proc"
